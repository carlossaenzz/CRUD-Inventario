<!DOCTYPE html>
<html lang="es">

<head>
    <!-- MetaDatos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
    <!-- Favicon -->
    <link rel="shortcut icon" href="image/logo/favicon2.png" type="image/x-icon">
    <!-- Boxicons es una biblioteca de íconos gratuitos y personalizables diseñada para proyectos web. -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Título -->
    <title>Gestor De Inventario | Iniciar Sesion</title>
</head>

<body>

    <main class="login__container">

        <!-- Formulario inicio de sesion -->
        <form class="login__form" id="loginForm">

            <h1 class="login__title">Iniciar Sesion</h1>

            <!-- Campo de usuario -->
            <div class="login__field">
                <label class="login__label">
                    <!-- el atributo for="" no es nesesario si el input esta dentro del label decir ya esta relacionado -->
                    <input class="login__input" type="text" id="usuario" name="usuario" placeholder="Usuario"
                        autocomplete="username" required aria-label="Usuario">
                    <i class="bx bx-user login__icon"></i>
                </label>
            </div>
            <!-- Campo de contraseña -->
            <div class="login__field">
                <label class="login__label">
                    <input class="login__input" type="password" id="password" name="password" placeholder="Contraseña"
                        autocomplete="current-password" required aria-label="Password">
                    <i class="bx bx-lock-alt login__icon"></i>
                </label>

            </div>
            <!-- Botón inicio de sesion -->
            <button class="login__button" type="submit">Entrar</button>


            <!-- Enlaces -->
            <!--<p class="form__link">
                <label>Recordarme
                    <input type="checkbox">
                </label>
                <a href="#">¿Olvidaste tu contraseña</a>
            </p> -->
            <p class="login__link">
                ¿No tienes una cuenta?<a href="pages/registro.html" aria-label="registrarse"> Regístrate</a>
            </p>
        </form>
    </main>

    <!-- Scripts -->
    <!-- Script para manejar la lógica de inicio de sesión y registro -->
    <script src="js/login.js"></script>
    <!-- Script para manejar el almacenamiento de datos -->
    <script src="js/storage.js"></script>

</body>

</html>
