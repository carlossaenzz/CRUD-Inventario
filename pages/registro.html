<!DOCTYPE html>
<html lang="en">
<head>
    <!-- MetaDatos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/registro.css">
    <!-- Favicon -->
    <link rel="shortcut icon" href="../image/logo/favicon2.png" type="image/x-icon">
    <!-- Boxicon -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"> 
    <!-- Título -->
    <title>Gestor De Inventarios | Login De Registro</title>
</head>
<body>
    <main class="register__container">

        <form class="register__form" id="registerForm">

            <h1 class="register__title">Registrate</h1>

            <!-- Campo de usuario -->
            <div class="register__field">
                <label class="register__label" for="nombre">
                    Nombre
                </label>

                <div class="register__control">
                    <input 
                        class="register__input" 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Nombre Completo" 
                        autocomplete="name" 
                        required aria-label="Nombre Completo"
                        >

                    <i class="bx bx-user register__icon"></i>

                </div>

            </div>  

            <!-- Campo de correo -->
            <div class="register__field">
                
                <label class="register__label" for="email">
                    Correo electrónico
                </label>

                <div class="register__control">
                    <input
                        class="register__input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required aria-label="Correo electrónico"
                    >

                    <i class="bx bx-envelope register__icon"></i>

                </div>

            </div>  

            <!-- Campo de usuario -->
            <div class="register__field">
                <label class="register__label" for="usuario">
                    Usuario
                </label>

                <div class="register__control">
                    <input
                        class="register__input"
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Nombre de usuario"
                        autocomplete="username"
                        required
                    >

                    <i class="bx bx-id-card register__icon"></i>

                </div>
                
            </div>

            <!-- Campo de contraseña -->
            <div class="register__field">
                <label class="register__label" for="password">
                    Contraseña
                </label>

                <div class="register__control">
                    <input
                        class="register__input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Contraseña"
                        autocomplete="new-password"
                        required aria-label="Contraseña"
                    >

                    <i class="bx bx-lock-alt register__icon"></i>

                </div>

            </div>

            <!-- Confirmar contraseña -->
            <div class="register__field">
                <label class="register__label" for="confirmPassword">
                    Confirmar contraseña
                </label>

                <div class="register__control">
                    <input
                        class="register__input"
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirmar contraseña"
                        autocomplete="new-password"
                        required aria-label="Confirmar contraseña"
                    >

                    <i class="bx bx-lock-alt register__icon"></i>

                </div>

            </div>

            <!-- Botón de registro -->
            <button class="register__button" type="submit">Registrarme</button>
            
            <!-- Volver al login-->
            <p class="register__link">
                ¿Ya tienes una cuenta? <a href="../index.html" aria-label="Iniciar sesión">Inicia sesión</a>
            </p>

        </form>

    </main>

    <script src="../js/login.js"></script>

</body>
</html>
